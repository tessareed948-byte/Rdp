name: MT5 EA Auto Trade

# Installs the Deriv MT5 terminal (so the Deriv server list is built in), compiles an
# Expert Advisor, starts the terminal with the EA attached, and waits for the EA to
# place one DEMO trade. No Python MT5 package is involved.
# Runs automatically on every push to the mt5-ea-trade branch.
on:
  push:
    branches: [mt5-ea-trade]
  workflow_dispatch:

jobs:
  ea-trade:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Deriv MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:TEMP "deriv5setup.exe"
          Invoke-WebRequest "https://download.mql5.com/cdn/web/deriv.com.limited/mt5/deriv5setup.exe" -OutFile $installer
          Write-Host "Installer size in bytes: $((Get-Item $installer).Length)"
          New-Item -ItemType Directory -Path "C:\MT5" -Force | Out-Null
          Start-Process -FilePath $installer -ArgumentList '/auto /path:"C:\MT5"' -Wait
          if (-not (Test-Path "C:\MT5\terminal64.exe")) {
            Write-Host "Contents of C:\MT5:"
            Get-ChildItem "C:\MT5" -ErrorAction SilentlyContinue | Select-Object Name
            throw "terminal64.exe not found in C:\MT5"
          }
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Compile the Expert Advisor
        shell: pwsh
        run: |
          # The first portable start copies the standard MQL5 files (Include, Experts, ...) into C:\MT5\MQL5.
          Start-Process -FilePath "C:\MT5\terminal64.exe" -ArgumentList "/portable" | Out-Null
          $trade = "C:\MT5\MQL5\Include\Trade\Trade.mqh"
          for ($i = 1; $i -le 24 -and -not (Test-Path $trade); $i++) { Start-Sleep -Seconds 5 }
          Write-Host "Trade.mqh present = $(Test-Path $trade)"
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5

          $dest = "C:\MT5\MQL5\Experts"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -Path "mql5\DemoAutoTrade.mq5" -Destination "$dest\DemoAutoTrade.mq5" -Force

          # /portable and /include make MetaEditor use C:\MT5\MQL5 instead of the AppData data folder.
          Start-Process -FilePath "C:\MT5\MetaEditor64.exe" -ArgumentList "/portable", "/compile:$dest\DemoAutoTrade.mq5", "/include:C:\MT5\MQL5", "/log:C:\MT5\compile.log" -Wait
          if (Test-Path "C:\MT5\compile.log") { Get-Content "C:\MT5\compile.log" }
          if (-not (Test-Path "$dest\DemoAutoTrade.ex5")) { throw "EA did not compile: DemoAutoTrade.ex5 not found" }
          Write-Host "EA compiled successfully"

      - name: Start MT5 with the EA and wait for the demo trade
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = "Continue"
          $ini = "C:\mt5_ea.ini"
          @(
            "[Common]"
            "Login=$env:MT5_LOGIN"
            "Password=$env:MT5_PASSWORD"
            "Server=$env:MT5_SERVER"
            "[Experts]"
            "AllowLiveTrading=1"
            "AllowDllImport=0"
            "Enabled=1"
            "[StartUp]"
            "Expert=DemoAutoTrade"
            "Symbol=EURUSD"
            "Period=H1"
          ) | Set-Content -LiteralPath $ini -Encoding ASCII

          $proc = Start-Process -FilePath "C:\MT5\terminal64.exe" -ArgumentList @("/portable", "/config:$ini") -PassThru
          Write-Host "Started terminal PID=$($proc.Id)"

          $resultFile = "C:\MT5\MQL5\Files\trade_result.txt"
          $placed = $false
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 10
            if (Test-Path $resultFile) {
              $text = Get-Content -LiteralPath $resultFile -Raw
              Write-Host "EA result: $text"
              if ($text -match "TRADE PLACED") { $placed = $true }
              break
            }
            Write-Host "Waiting for the EA result after $($i * 10) seconds"
          }

          Write-Host "===== EXPERT LOG, LAST 15 LINES ====="
          $log = Get-ChildItem -Path "C:\MT5\MQL5\Logs" -Filter "*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($log) { Get-Content -LiteralPath $log.FullName -Tail 15 } else { Write-Host "No expert log found" }

          Write-Host "===== TERMINAL LOG, NETWORK AND LOGIN LINES ====="
          $tlog = Get-ChildItem -Path "C:\MT5\logs" -Filter "2*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($tlog) {
            Get-Content -LiteralPath $tlog.FullName | Select-String -Pattern "Network|authoriz|login|server" | Select-Object -Last 20 | ForEach-Object { Write-Host $_.Line }
          } else {
            Write-Host "No terminal log found"
          }

          Write-Host "===== TERMINAL PROCESS ====="
          Get-Process terminal64 -ErrorAction SilentlyContinue | Select-Object Id, SessionId, Responding, MainWindowTitle | Format-List

          Remove-Item -LiteralPath $ini -Force -ErrorAction SilentlyContinue

          if (-not $placed) {
            Write-Host "RESULT: no trade was confirmed"
            exit 1
          }
          Write-Host "RESULT: demo trade placed by the EA"
