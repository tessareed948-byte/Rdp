name: Scanner adapter safety tests

on:
  pull_request:
    paths:
      - "scanner_signal_adapter.py"
      - "test_scanner_signal_adapter.py"
      - ".github/workflows/scanner-adapter-tests.yml"
  push:
    branches: ["integration/scanner-adapters-safe"]
    paths:
      - "scanner_signal_adapter.py"
      - "test_scanner_signal_adapter.py"
      - ".github/workflows/scanner-adapter-tests.yml"

permissions:
  contents: read

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile adapters
        run: python -m py_compile scanner_signal_adapter.py test_scanner_signal_adapter.py
      - name: Run adapter safety tests
        run: |
          python -m pip install pytest
          python -m pytest -q test_scanner_signal_adapter.py
