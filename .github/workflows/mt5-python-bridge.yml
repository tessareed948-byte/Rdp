name: MT5 Python Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mt5-python-bridge.yml"
      - "demo_gold_limit.py"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: mt5-python-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: Deriv-Demo
      MT5_TERMINAL_PATH: ${{ secrets.MT5_TERMINAL_PATH }}
      SIGNALS_URL: ${{ secrets.SIGNALS_URL }}
      SIGNALS_ACCESS_KEY: ${{ secrets.SIGNALS_ACCESS_KEY }}
      SIGNALS_AUTH_HEADER: ${{ secrets.SIGNALS_AUTH_HEADER }}
      MT5_SYMBOL_MAP: ${{ secrets.MT5_SYMBOL_MAP }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      DEMO_ONLY: "true"
      ALLOW_DEMO_TRADING: "false"
      RISK_PERCENT: "0.25"
      POLL_SECONDS: "20"
      MT5_MAGIC: "20261111"

    steps:
      - name: Checkout bridge
        uses: actions/checkout@v4

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight verify scripts and safety locks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m py_compile demo_gold_limit.py mt5_bridge.py
          $loginScript = Get-Content "demo_gold_limit.py" -Raw
          if ($loginScript -notmatch "mt5\.initialize\(" -or
              $loginScript -notmatch "login=LOGIN" -or
              $loginScript -notmatch "password=PASSWORD" -or
              $loginScript -notmatch "server=SERVER") {
            throw "Preflight failed: backend login parameters are incomplete."
          }
          if ($loginScript -match "order_send\(") {
            throw "Preflight failed: login-only test must not contain order submission."
          }
          Write-Host "PREFLIGHT PASSED: Python syntax valid; backend credentials wired; no order submission in login test."

      - name: Validate required configuration
        shell: pwsh
        run: |
          foreach ($name in @("MT5_LOGIN", "MT5_PASSWORD", "MT5_SERVER")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing repository Actions secret: $name"
            }
          }
          if ($env:DEMO_ONLY -ne "true" -or $env:ALLOW_DEMO_TRADING -ne "false") {
            throw "Unsafe configuration. Workflow is locked to demo validation."
          }

      - name: Install and connect Tailscale (optional)
        if: ${{ env.TAILSCALE_AUTHKEY != '' }}
        shell: pwsh
        run: |
          $msi = Join-Path $env:TEMP "tailscale.msi"
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList @("/i", $msi, "/quiet", "/norestart") -Wait
          $ts = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) { throw "Tailscale installation failed" }
          & $ts up "--authkey=$env:TAILSCALE_AUTHKEY" "--hostname=utfx-mt5-$env:GITHUB_RUN_ID" --accept-routes=false
          $ip = & $ts ip -4
          if (-not $ip) { throw "Tailscale did not assign an IPv4 address" }
          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Tailscale connected. Private IP: $ip"

      - name: Configure private RDP (optional)
        if: ${{ env.TAILSCALE_AUTHKEY != '' && env.RDP_PASSWORD != '' }}
        shell: pwsh
        run: |
          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RDP" -Password $secure -PasswordNeverExpires
          } else {
            Set-LocalUser -Name "RDP" -Password $secure
          }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue | Disable-NetFirewallRule
          New-NetFirewallRule -DisplayName "RDP only over Tailscale" -Direction Inbound -Protocol TCP -LocalPort 3389 -RemoteAddress "100.64.0.0/10" -Action Allow
          Restart-Service TermService -Force
          Write-Host "RDP enabled with NLA and restricted to Tailscale addresses. Password not printed."

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install MetaTrader 5 terminal
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:TEMP "mt5setup.exe"
          Invoke-WebRequest "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
          if ((Get-Item $installer).Length -lt 1000000) { throw "MetaTrader installer download is unexpectedly small" }

          # Use a path without spaces so the web installer receives /path as one argument.
          $target = "C:\MT5"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $process = Start-Process -FilePath $installer -ArgumentList '/auto /path:"C:\MT5"' -Wait -PassThru
          Write-Host "MetaTrader installer process exited with code $($process.ExitCode)"

          $terminal = Join-Path $target "terminal64.exe"
          if (-not (Test-Path $terminal)) {
            $candidates = @(
              "$env:ProgramFiles\MetaTrader 5\terminal64.exe",
              "${env:ProgramFiles(x86)}\MetaTrader 5\terminal64.exe",
              "$env:APPDATA\MetaQuotes\Terminal\terminal64.exe"
            )
            $terminal = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $terminal) {
            $terminal = Get-ChildItem -Path @("C:\MT5", "$env:ProgramFiles\MetaTrader 5", "${env:ProgramFiles(x86)}\MetaTrader 5") -Filter terminal64.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $terminal) {
            Write-Host "Installer exit code: $($process.ExitCode)"
            Write-Host "MT5 install directory contents:"
            Get-ChildItem -Path "C:\MT5" -Force -ErrorAction SilentlyContinue | Select-Object Name, Length
            throw "MT5 terminal installation could not be verified after automatic installation"
          }
          "MT5_TERMINAL_PATH=$terminal" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "MT5 terminal verified at: $terminal"

      - name: Verify backend MT5 demo login and IPC (no orders)
        shell: pwsh
        run: python demo_gold_limit.py

      - name: Compile bridge
        shell: pwsh
        run: python -m py_compile mt5_bridge.py demo_gold_limit.py

      - name: Run signal bridge
        if: ${{ env.SIGNALS_URL != '' && env.SIGNALS_ACCESS_KEY != '' }}
        shell: pwsh
        run: python mt5_bridge.py
        timeout-minutes: 15

      - name: Setup-only mode
        if: ${{ env.SIGNALS_URL == '' || env.SIGNALS_ACCESS_KEY == '' }}
        shell: pwsh
        run: |
          Write-Host "Setup-only mode: Windows, Tailscale, RDP and MT5 installation checks completed."
          Write-Host "Signal polling is skipped until SIGNALS_URL and SIGNALS_ACCESS_KEY are configured."

      - name: Keep RDP session available briefly
        if: ${{ always() && env.TAILSCALE_AUTHKEY != '' && env.RDP_PASSWORD != '' }}
        shell: pwsh
        run: |
          Write-Host "RDP is available over Tailscale for 90 seconds. Connect now."
          if ($env:TAILSCALE_IP) {
            $details = "Host: $env:TAILSCALE_IP`r`nUsername: RDP`r`nPort: 3389`r`nPassword: use repository secret RDP_PASSWORD`r`n"
            $details | Out-File -FilePath "connection-details.txt" -Encoding utf8
            "## RDP connection details`n`n- Host: **$env:TAILSCALE_IP**`n- Username: **RDP**`n- Port: **3389**`n- Password: use the repository secret `RDP_PASSWORD`.`n`nThis runner shuts down after the 90-second window." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Write-Host "RDP Host: $env:TAILSCALE_IP | Username: RDP | Port: 3389"
          }
          Start-Sleep -Seconds 90

      - name: Upload bridge journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-bridge-journal-${{ github.run_id }}
          path: |
            bridge_state.sqlite3
            connection-details.txt
          if-no-files-found: ignore
          retention-days: 14
