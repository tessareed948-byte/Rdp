name: FX Desk Deriv DEMO execution

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fxdesk-demo-execution.yml"
      - "fxdesk_demo_executor.py"
      - "test_fxdesk_demo_executor.py"
  workflow_dispatch:
    inputs:
      signal_key:
        description: Stable signal fingerprint from Aurora Telegram bot
        required: false
        type: string
      signal_payload:
        description: Normalized FX Desk signal JSON
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fxdesk-demo-${{ inputs.signal_key || github.run_id }} 
  cancel-in-progress: false

jobs:
  execute-one-demo-signal:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}
      MT5_TERMINAL_PATH: C:\MT5\terminal64.exe
      MT5_SYMBOL_MAP: ${{ secrets.MT5_SYMBOL_MAP }}
      DEMO_ONLY: "true"
      ALLOW_DEMO_TRADING: "true"
      MAX_RISK_PERCENT: "0.25"
      MAX_ENTRY_DEVIATION_POINTS: "100"
      MT5_MAGIC: "20261120"
      SIGNAL_KEY: ${{ inputs.signal_key }}
      SIGNAL_PAYLOAD: ${{ inputs.signal_payload }}
      FXDESK_CALLBACK_URL: ${{ secrets.FXDESK_CALLBACK_URL }}
      FXDESK_CALLBACK_SECRET: ${{ secrets.FXDESK_CALLBACK_SECRET }}

    steps:
      - name: Checkout isolated executor
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install MetaTrader5==5.0.6231 pytest
      - name: Compile and run safety tests
        shell: pwsh
        run: |
          python -m py_compile fxdesk_demo_executor.py
          python -m pytest -q test_fxdesk_demo_executor.py
          if ($LASTEXITCODE -ne 0) { throw "Executor safety tests failed." }
      - name: Validate configured Deriv demo account
        shell: pwsh
        run: |
          foreach ($name in @("MT5_LOGIN", "MT5_PASSWORD", "MT5_SERVER")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing Actions secret: $name" }
          }
          if ($env:DEMO_ONLY -ne "true" -or $env:ALLOW_DEMO_TRADING -ne "true") { throw "Unsafe workflow configuration." }
          if ($env:MT5_SERVER -notmatch "(?i)deriv") { throw "Configured server is not identified as Deriv." }
      - name: Require result callback for every signal execution
        if: ${{ inputs.signal_payload != '' }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FXDESK_CALLBACK_URL) -or
              [string]::IsNullOrWhiteSpace($env:FXDESK_CALLBACK_SECRET)) {
            throw "Signal execution is blocked until FXDESK_CALLBACK_URL and FXDESK_CALLBACK_SECRET are configured."
          }
      - name: Install MT5 terminal
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:TEMP "mt5setup.exe"
          Invoke-WebRequest "https://download.mql5.com/cdn/web/deriv.com.limited/mt5/deriv5setup.exe" -OutFile $installer
          if ((Get-Item $installer).Length -lt 1000000) { throw "MetaTrader installer download is unexpectedly small" }

          # Match the proven MT5 Python Demo Trade installation and path discovery.
          $target = "C:\MT5"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $process = Start-Process -FilePath $installer -ArgumentList '/auto /path:"C:\MT5"' -Wait -PassThru
          Write-Host "MetaTrader installer process exited with code $($process.ExitCode)"

          $terminal = Join-Path $target "terminal64.exe"
          if (-not (Test-Path $terminal)) {
            $candidates = @(
              "$env:ProgramFiles\MetaTrader 5\terminal64.exe",
              "${env:ProgramFiles(x86)}\MetaTrader 5\terminal64.exe",
              "$env:APPDATA\MetaQuotes\Terminal\terminal64.exe"
            )
            $terminal = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $terminal) {
            $terminal = Get-ChildItem -Path @("C:\MT5", "$env:ProgramFiles\MetaTrader 5", "${env:ProgramFiles(x86)}\MetaTrader 5") -Filter terminal64.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $terminal) {
            throw "MT5 terminal installation could not be verified after automatic installation"
          }
          "MT5_TERMINAL_PATH=$terminal" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "MT5 terminal verified at: $terminal"

      - name: Start MT5 terminal and wait for broker synchronization
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $terminal = $env:MT5_TERMINAL_PATH
          if (-not (Test-Path -LiteralPath $terminal)) {
            throw "Expected MT5 terminal not found at $terminal"
          }

          # Use the same Deriv portable-terminal login sequence as xau-scan-demo.yml.
          $ini = "C:\mt5-fxdesk-demo.ini"
          @(
            "[Common]"
            "Login=$("$env:MT5_LOGIN".Trim())"
            "Password=$("$env:MT5_PASSWORD".Trim())"
            "Server=$("$env:MT5_SERVER".Trim())"
            "[Experts]"
            "Enabled=1"
            "AllowLiveTrading=1"
          ) | Set-Content -LiteralPath $ini -Encoding ASCII

          $existing = Get-CimInstance Win32_Process -Filter "Name = 'terminal64.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.ExecutablePath -eq $terminal }
          if (-not $existing) {
            $proc = Start-Process -FilePath $terminal -ArgumentList @("/portable", "/config:$ini") -PassThru
            Write-Host "Deriv terminal started. PID=$($proc.Id)"
          } else {
            Write-Host "Deriv terminal already running. PID(s)=$($existing.ProcessId -join ', ')"
          }

          $running = $null
          for ($i = 0; $i -lt 24; $i++) {
            Start-Sleep -Seconds 5
            $running = Get-CimInstance Win32_Process -Filter "Name = 'terminal64.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.ExecutablePath -eq $terminal }
            if ($running) { break }
          }
          if (-not $running) { throw "MT5 terminal did not remain running." }

          Start-Sleep -Seconds 70
          Write-Host "Terminal synchronized after 70 seconds."

      - name: Run Python connection check or guarded signal execution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $resultPath = Join-Path $env:GITHUB_WORKSPACE "fxdesk-execution-result.json"

          if ([string]::IsNullOrWhiteSpace($env:SIGNAL_PAYLOAD)) {
            Write-Host "No signal payload: connection check only; no order can be sent."
            $output = & python fxdesk_demo_executor.py --self-test 2>&1
          } else {
            $output = & python fxdesk_demo_executor.py 2>&1
          }
          $pythonExit = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          $resultLine = $output | Where-Object { "$_" -like "EXECUTION_RESULT=*" } | Select-Object -Last 1
          if ($resultLine) {
            "$resultLine".Substring("EXECUTION_RESULT=".Length) |
              Set-Content -LiteralPath $resultPath -Encoding UTF8
          } else {
            $details = ($output | ForEach-Object { "$_" }) -join " "
            $failure = @{
              status = "failed"
              demo = $false
              order_sent = $false
              error = $details.Substring(0, [Math]::Min(500, $details.Length))
            } | ConvertTo-Json -Compress
            $failure | Set-Content -LiteralPath $resultPath -Encoding UTF8
          }
          if ($pythonExit -ne 0) { throw "FX Desk demo executor failed with exit code $pythonExit." }

      - name: Send execution result to Aurora Telegram
        if: ${{ always() && inputs.signal_payload != '' }}
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:GITHUB_WORKSPACE "fxdesk-execution-result.json"
          if (Test-Path -LiteralPath $resultPath) {
            $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          } else {
            $result = @{
              status = "runner_failed_before_executor"
              demo = $false
              order_sent = $false
              error = "The runner stopped before the executor produced a result."
            }
          }
          $body = @{
            fingerprint = $env:SIGNAL_KEY
            result = $result
          } | ConvertTo-Json -Depth 8 -Compress
          Invoke-RestMethod -Uri $env:FXDESK_CALLBACK_URL -Method Post -Headers @{ "X-FXDesk-Callback-Secret" = $env:FXDESK_CALLBACK_SECRET } -ContentType "application/json" -Body $body | Out-Null
          Write-Host "Execution outcome delivered to Aurora Telegram monitoring endpoint."

      - name: Shut down runner terminal
        if: always()
        shell: pwsh
        run: |
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item "C:\mt5-fxdesk-demo.ini" -Force -ErrorAction SilentlyContinue
          Write-Host "Runner/MT5 session released. Broker-side demo SL/TP remains active."
