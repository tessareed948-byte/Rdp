name: Autonomous 24/7 5m Zero-Gemini Scanner, Confirmation Watcher & Trade Monitor

on:
  schedule:
    # 1. 24/7 High-Frequency Chart Watcher (every 5m): re-checks pending Break-and-Retest confirmations,
    #    scans all open allowed pairs with 0 Gemini tokens (Free-First + Twelve Data On-Demand), and protects open trades
    - cron: '*/5 * * * *'
    # 2. Daily Pre-London Self-Upgrade Audit (06:00 UTC Mon-Fri): optimizes strategies, entry models & wait times
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: aurora-autonomous-scanner-24x7
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger-vercel-rr-plus-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Run Daily Pre-London Self-Upgrade & Auto-Push Check (06:00 UTC)
        if: ${{ github.event.schedule == '0 6 * * 1-5' || github.event_name == 'workflow_dispatch' }}
        env:
          CRON_SECRET: ${{ secrets.VERCEL_CRON_SECRET || secrets.CRON_SECRET || secrets.BRIDGE_CALLBACK_TOKEN }}
          BRIDGE_CALLBACK_TOKEN: ${{ secrets.BRIDGE_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          CRON_SECRET=$(printf '%s' "${CRON_SECRET:-}" | tr -d '\r\n')
          BRIDGE_CALLBACK_TOKEN=$(printf '%s' "${BRIDGE_CALLBACK_TOKEN:-}" | tr -d '\r\n')
          AUTH_KEY="${CRON_SECRET:-$BRIDGE_CALLBACK_TOKEN}"
          CODE=$(curl -sS --max-time 55 -o /tmp/self_upgrade.txt -w "%{http_code}" -X POST "https://trade.eunknowntech.com/api/cron/self-upgrade" \
            -A "AuroraTrade-SelfUpgrade/1.0" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $AUTH_KEY" \
            -H "X-Bridge-Callback-Token: $BRIDGE_CALLBACK_TOKEN" \
            -H "Authorization: Bearer $AUTH_KEY" \
            -d '{"force":false}')
          echo "SELF_UPGRADE_HTTP=$CODE"
          head -c 500 /tmp/self_upgrade.txt || true
          echo ""
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then exit 1; fi

      - name: Run 24/7 Zero-Gemini Deterministic Scan + Confirmation Recheck + Auto-Trade Dispatch
        if: ${{ github.event.schedule != '0 6 * * 1-5' }}
        env:
          CRON_SECRET: ${{ secrets.VERCEL_CRON_SECRET || secrets.CRON_SECRET || secrets.BRIDGE_CALLBACK_TOKEN }}
          BRIDGE_CALLBACK_TOKEN: ${{ secrets.BRIDGE_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          CRON_SECRET=$(printf '%s' "${CRON_SECRET:-}" | tr -d '\r\n')
          BRIDGE_CALLBACK_TOKEN=$(printf '%s' "${BRIDGE_CALLBACK_TOKEN:-}" | tr -d '\r\n')
          AUTH_KEY="${CRON_SECRET:-$BRIDGE_CALLBACK_TOKEN}"
          CODE=$(curl -sS --max-time 55 -o /tmp/auto_cycle.txt -w "%{http_code}" -X POST "https://trade.eunknowntech.com/api/automation/cycle" \
            -A "AuroraTrade-AutoScanner/2.0" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $AUTH_KEY" \
            -H "X-Bridge-Callback-Token: $BRIDGE_CALLBACK_TOKEN" \
            -H "Authorization: Bearer $AUTH_KEY" \
            -d '{"style":"DAY_TRADING","useGeminiGate":false,"dispatchToGitHub":true,"source":"github-actions-24x7-5m"}')
          echo "AUTOMATION_CYCLE_HTTP=$CODE"
          head -c 600 /tmp/auto_cycle.txt || true
          echo ""
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then exit 1; fi

      - name: Trigger Trade Monitor & Open Position Profit-Protection Tick
        if: ${{ always() && github.event.schedule != '0 6 * * 1-5' }}
        env:
          CRON_SECRET: ${{ secrets.VERCEL_CRON_SECRET || secrets.CRON_SECRET || secrets.BRIDGE_CALLBACK_TOKEN }}
          BRIDGE_CALLBACK_TOKEN: ${{ secrets.BRIDGE_CALLBACK_TOKEN }}
        run: |
          CRON_SECRET=$(printf '%s' "${CRON_SECRET:-}" | tr -d '\r\n')
          BRIDGE_CALLBACK_TOKEN=$(printf '%s' "${BRIDGE_CALLBACK_TOKEN:-}" | tr -d '\r\n')
          AUTH_KEY="${CRON_SECRET:-$BRIDGE_CALLBACK_TOKEN}"
          CODE=$(curl -sS --max-time 55 -o /tmp/trade_monitor.txt -w "%{http_code}" -X POST "https://trade.eunknowntech.com/api/cron/trade-monitor" \
            -A "AuroraTrade-Monitor/1.0" \
            -H "X-API-Key: $AUTH_KEY" \
            -H "X-Bridge-Callback-Token: $BRIDGE_CALLBACK_TOKEN" \
            -H "Authorization: Bearer $AUTH_KEY") || CODE="000"
          echo "TRADE_MONITOR_HTTP=$CODE"
          head -c 300 /tmp/trade_monitor.txt || true
          echo ""
