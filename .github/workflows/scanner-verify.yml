name: XAU Indicator Read-only Verification

on:
  workflow_dispatch:
  push:
    branches: [xau-indicator-verification]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install MetaTrader5==5.0.6231 pandas numpy tzdata

      - name: Install Deriv terminal
        shell: pwsh
        env:
          MT5_INSTALLER_URL: ${{ vars.MT5_INSTALLER_URL || 'https://download.mql5.com/cdn/web/deriv.com.limited/mt5/deriv5setup.exe' }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:TEMP "deriv-mt5-installer.exe"
          Invoke-WebRequest $env:MT5_INSTALLER_URL -OutFile $installer -ErrorAction Stop
          $bytes = [System.IO.File]::ReadAllBytes($installer)
          if (-not ($bytes.Length -gt 500KB -and $bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A)) { throw "Downloaded file is not a valid Windows installer" }
          New-Item -ItemType Directory -Path "C:\MT5" -Force | Out-Null
          Start-Process -FilePath $installer -ArgumentList '/auto /path:"C:\MT5"' -Wait
          if (-not (Test-Path "C:\MT5\terminal64.exe")) { throw "Deriv terminal64.exe not found" }
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Connect to Deriv DEMO and verify indicator
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.DERIV_LOGIN || secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.DERIV_PASSWORD || secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.DERIV_SERVER || secrets.MT5_SERVER }}
          MT5_TERMINAL_PATH: 'C:\MT5\terminal64.exe'
          SCAN_SYMBOL: ${{ vars.SCAN_SYMBOL || 'XAUUSD' }}
          SCAN_BARS: "30000"
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("MT5_LOGIN", "MT5_PASSWORD", "MT5_SERVER")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing Deriv DEMO Actions secret: $name" }
          }
          if ($env:MT5_SERVER -notmatch "(?i)deriv") { throw "Configured broker server is not Deriv" }

          function Get-SyncCount {
            $f = Get-ChildItem -Path "C:\MT5\logs" -Filter "2*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $f) { return 0 }
            return @(Get-Content -LiteralPath $f.FullName | Select-String -Pattern "terminal synchronized with").Count
          }

          $ini = "C:\mt5-deriv-readonly.ini"
          @(
            "[Common]"
            "Login=$($env:MT5_LOGIN.Trim())"
            "Password=$($env:MT5_PASSWORD.Trim())"
            "Server=$($env:MT5_SERVER.Trim())"
          ) | Set-Content -LiteralPath $ini -Encoding ASCII

          $before = Get-SyncCount
          $proc = Start-Process -FilePath $env:MT5_TERMINAL_PATH -ArgumentList @("/portable", "/config:$ini") -PassThru
          Write-Host "Deriv terminal started. PID=$($proc.Id)"
          $synced = $false
          for ($i = 1; $i -le 36; $i++) {
            Start-Sleep -Seconds 5
            if ((Get-SyncCount) -gt $before) { $synced = $true; break }
          }
          if (-not $synced) { throw "Deriv terminal did not synchronize with the broker" }
          Start-Sleep -Seconds 10

          python verify_scanner.py
          $code = $LASTEXITCODE
          Remove-Item -LiteralPath $ini -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "XAU indicator verification failed with exit code $code" }

      - name: Shut down terminal
        if: always()
        shell: pwsh
        run: |
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item "C:\mt5-deriv-readonly.ini" -Force -ErrorAction SilentlyContinue
