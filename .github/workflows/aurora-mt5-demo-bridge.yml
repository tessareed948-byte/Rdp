name: Aurora Trade MT5 Demo Auto-Bridge (aurora-mt5-demo-bridge.yml)

on:
  repository_dispatch:
    types: [bot_trade_signal]
  workflow_dispatch:
    inputs:
      trade_payload_json:
        description: 'JSON RR+ trade payload from Aurora Trade'
        required: false
        type: string
        default: '{"symbol":"XAUUSD","direction":"BUY","order_type":"MARKET_BUY","lot_size":0.01,"risk_percent":1.0,"strategy":"Manual Deriv Demo Live Trade","dry_run":false}'
      dry_run:
        description: 'Live Deriv Demo Auto-Trade is ON by default (false). Set true for dry-run check only.'
        required: false
        type: boolean
        default: false

concurrency:
  group: aurora-mt5-bridge-${{ (github.event.client_payload.event_action || 'OPEN') == 'ACCOUNT_SYNC' && 'account-sync' || (github.event.client_payload.idempotency_key || github.run_id) }}
  cancel-in-progress: ${{ (github.event.client_payload.event_action || 'OPEN') == 'ACCOUNT_SYNC' }}

permissions:
  contents: read

jobs:
  watchdog-preflight:
    name: Pre-Flight Runner Connection Watchdog (Linux 1x Credits)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      proceed: ${{ steps.watchdog.outputs.proceed }}
      skip_reason: ${{ steps.watchdog.outputs.skip_reason }}
    steps:
      - name: Validate MT5 secrets, payload geometry, AuroraTrade health & Deriv connectivity
        id: watchdog
        shell: python3 {0}
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          AURORA_CALLBACK_URL: https://trade.eunknowntech.com/api/broker/github/callback
          DISPATCH_PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
          MANUAL_PAYLOAD_JSON: ${{ github.event.inputs.trade_payload_json }}
        run: |
          import json, os, socket, urllib.request
          from urllib.parse import urlparse

          def emit(ok, reason):
            val = "true" if ok else "false"
            clean = str(reason).replace("\n", " ")[:220]
            print(f"[Watchdog] proceed={val} | {clean}")
            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"proceed={val}\n")
              fh.write(f"skip_reason={clean}\n")

          def tcp_ok(host, port=443):
            try:
              with socket.create_connection((host, port), timeout=5):
                return True
            except OSError:
              return False

          if not (os.environ.get("MT5_LOGIN") and os.environ.get("MT5_PASSWORD") and os.environ.get("MT5_SERVER")):
            emit(False, "Missing MT5_LOGIN, MT5_PASSWORD, or MT5_SERVER secrets")
            raise SystemExit(0)

          payload = {}
          raw_d = os.environ.get("DISPATCH_PAYLOAD_JSON", "").strip()
          raw_m = os.environ.get("MANUAL_PAYLOAD_JSON", "").strip()
          try:
            if raw_d and raw_d not in ("null", "{}"):
              outer = json.loads(raw_d)
              payload = json.loads(outer["payload_json"]) if isinstance(outer, dict) and outer.get("payload_json") else outer
            elif raw_m:
              payload = json.loads(raw_m)
          except Exception:
            payload = {}

          action = str(payload.get("event_action") or "OPEN").upper()
          if action == "OPEN":
            sym = str(payload.get("symbol") or "").strip()
            lot = float(payload.get("lot_size") or 0)
            sl = float(payload.get("stop_loss") or 0)
            tp = float(payload.get("take_profit") or 0)
            if not sym or lot <= 0 or sl <= 0 or tp <= 0:
              emit(False, f"Invalid or unprotected OPEN payload (sym={sym}, lot={lot}, sl={sl}, tp={tp})")
              raise SystemExit(0)

          cb = os.environ.get("AURORA_CALLBACK_URL", "")
          if cb and action != "CLOSE":
            p = urlparse(cb)
            try:
              req = urllib.request.Request(f"{p.scheme}://{p.netloc}/api/health", headers={"User-Agent": "AuroraWatchdog/1.0"})
              with urllib.request.urlopen(req, timeout=8) as r:
                if r.status >= 500:
                  emit(False, f"AuroraTrade health HTTP {r.status}")
                  raise SystemExit(0)
            except Exception as e:
              emit(False, f"AuroraTrade health unreachable: {e}")
              raise SystemExit(0)

          if not (tcp_ok("ws.derivws.com") or tcp_ok("api.deriv.com") or tcp_ok("download.mql5.com")):
            emit(False, "Deriv broker network unreachable from runner")
            raise SystemExit(0)

          emit(True, f"Watchdog OK for {action} — launching Windows MT5 executor")

  execute-deriv-mt5-demo:
    name: Execute on Deriv MT5 (Conditional Windows Runner)
    needs: watchdog-preflight
    if: needs.watchdog-preflight.outputs.proceed == 'true'
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12 (with pip cache to minimize runner minutes)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Restore cached Python MT5 virtualenv (skips pip install on hit)
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: C:\mt5_venv
          key: mt5-py312-venv-5.0.6231-win2022
          restore-keys: |
            mt5-py312-venv-

      - name: Create venv & install MetaTrader5 Python package (only on cache miss)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\mt5_venv\Scripts\python.exe")) {
            python -m venv C:\mt5_venv
          }
          C:\mt5_venv\Scripts\pip.exe install --quiet --disable-pip-version-check MetaTrader5==5.0.6231

      - name: Restore cached Deriv MT5 terminal (avoids download.mql5.com timeouts)
        id: mt5-cache
        uses: actions/cache@v4
        with:
          path: C:\MT5
          key: deriv-mt5-portable-v2-win2022
          restore-keys: |
            deriv-mt5-portable-v2-

      - name: Download & install Deriv MT5 terminal (/portable) with multi-mirror retry
        if: steps.mt5-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (Test-Path "C:\MT5\terminal64.exe") {
            Write-Host "MT5 terminal64.exe already present in C:\MT5"
            exit 0
          }
          $installer = "C:\deriv5setup.exe"
          $mirrors = @(
            "https://download.mql5.com/cdn/web/deriv.com.limited/mt5/deriv5setup.exe",
            "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe",
            "https://download.terminal.free/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          )
          $downloaded = $false
          foreach ($url in $mirrors) {
            Write-Host "Attempting MT5 installer download from $url ..."
            & curl.exe -fSL --retry 4 --retry-delay 3 --retry-all-errors --connect-timeout 25 --max-time 90 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o $installer $url
            if ($LASTEXITCODE -eq 0 -and (Test-Path $installer) -and ((Get-Item $installer).Length -gt 200000)) {
              Write-Host "Downloaded MT5 installer cleanly from $url ($((Get-Item $installer).Length) bytes)."
              $downloaded = $true
              break
            }
            try {
              Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing -TimeoutSec 45
              if ((Test-Path $installer) -and ((Get-Item $installer).Length -gt 200000)) {
                Write-Host "Downloaded MT5 installer via Invoke-WebRequest from $url."
                $downloaded = $true
                break
              }
            } catch {
              Write-Warning "Mirror failed ($url): $($_.Exception.Message)"
            }
          }
          if (-not $downloaded) {
            Write-Error "All MT5 installer mirrors failed to respond. Retry shortly or verify GitHub runner outbound network."
            exit 1
          }
          Start-Process -FilePath $installer -ArgumentList '/auto', '/path:"C:\MT5"' -Wait
          if (-not (Test-Path "C:\MT5\terminal64.exe")) {
            Write-Error "Deriv MT5 terminal64.exe not found after install"
            exit 1
          }
          Stop-Process -Name terminal64 -Force -ErrorAction SilentlyContinue

      - name: Launch Deriv MT5 Demo terminal & fast-poll broker sync
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          if (-not $env:MT5_LOGIN -or -not $env:MT5_PASSWORD -or -not $env:MT5_SERVER) {
            Write-Error "Missing MT5_LOGIN, MT5_PASSWORD, or MT5_SERVER secrets."
            exit 1
          }
          $iniLines = @(
            "[Common]",
            "Login=$($env:MT5_LOGIN)",
            "Password=$($env:MT5_PASSWORD)",
            "Server=$($env:MT5_SERVER)",
            "KeepPrivate=1",
            "NewsEnable=0",
            "[Experts]",
            "Enabled=1",
            "AllowLiveTrading=1",
            "AllowDllImport=0"
          )
          Set-Content -Path "C:\mt5_login.ini" -Value ($iniLines -join "`r`n") -Encoding ASCII
          Start-Process -FilePath "C:\MT5\terminal64.exe" -ArgumentList "/portable", "/config:C:\mt5_login.ini"
          $synced = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            $log = Get-ChildItem "C:\MT5\logs\2*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($log) {
              $txt = Get-Content $log.FullName -Raw -ErrorAction SilentlyContinue
              if ($txt -match "terminal synchronized with") {
                Write-Host "Deriv MT5 synchronized in $(($i + 1) * 2)s."
                $synced = $true
                break
              }
            }
          }
          if (-not $synced) { Write-Host "Proceeding after sync wait; Python mt5.login() will verify." }
          Start-Sleep -Seconds 3

      - name: Execute Aurora Trade RR+ Order & Send Authenticated Callback
        id: mt5-exec
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_TERMINAL_PATH: C:\MT5\terminal64.exe
          BRIDGE_CALLBACK_TOKEN: ${{ secrets.BRIDGE_CALLBACK_TOKEN }}
          AURORA_CALLBACK_URL: https://trade.eunknowntech.com/api/broker/github/callback
          DISPATCH_PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
          MANUAL_PAYLOAD_JSON: ${{ github.event.inputs.trade_payload_json }}
          MANUAL_DRY_RUN: ${{ github.event.inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if (Test-Path "C:\mt5_venv\Scripts\python.exe") {
            & C:\mt5_venv\Scripts\python.exe aurora_mt5_executor.py
          } else {
            python aurora_mt5_executor.py
          }

      - name: Report workflow setup/execution failure back to Aurora Trade immediately
        if: failure()
        shell: pwsh
        env:
          BRIDGE_CALLBACK_TOKEN: ${{ secrets.BRIDGE_CALLBACK_TOKEN }}
          AURORA_CALLBACK_URL: https://trade.eunknowntech.com/api/broker/github/callback
          IDEMPOTENCY_KEY: ${{ github.event.client_payload.idempotency_key || format('ghrun_{0}', github.run_id) }}
          SYMBOL_NAME: ${{ github.event.client_payload.symbol || 'ACCOUNT_SYNC' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if (-not $env:BRIDGE_CALLBACK_TOKEN) { exit 0 }
          $runUrl = "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)"
          $payload = @{
            idempotency_key = $env:IDEMPOTENCY_KEY
            status = "BROKER_REJECTED"
            symbol = $env:SYMBOL_NAME
            broker_message = "GitHub Actions runner failed before MT5 callback (Run #$($env:GITHUB_RUN_ID)). Inspect logs: $runUrl"
          } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Method Post -Uri $env:AURORA_CALLBACK_URL -Headers @{ "X-Bridge-Callback-Token" = $env:BRIDGE_CALLBACK_TOKEN } -ContentType "application/json" -Body $payload -TimeoutSec 20
          } catch {
            Write-Warning "Failure callback dispatch error: $($_.Exception.Message)"
          }

      - name: Cleanup temporary MT5 login config & terminal
        if: always()
        shell: pwsh
        run: |
          Remove-Item "C:\mt5_login.ini" -Force -ErrorAction SilentlyContinue
          Stop-Process -Name terminal64 -Force -ErrorAction SilentlyContinue
