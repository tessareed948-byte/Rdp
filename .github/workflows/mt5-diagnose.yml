name: MT5 Diagnose

# Diagnostic only. Starts MT5, waits for a broker connection, takes a screenshot
# and tries several ways of attaching Python. No orders are sent.
# Runs automatically on every push to the mt5-diagnose branch.
on:
  push:
    branches: [mt5-diagnose]

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip show MetaTrader5

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:TEMP "mt5setup.exe"
          Invoke-WebRequest "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
          New-Item -ItemType Directory -Path "C:\MT5" -Force | Out-Null
          Start-Process -FilePath $installer -ArgumentList '/auto /path:"C:\MT5"' -Wait
          if (-not (Test-Path "C:\MT5\terminal64.exe")) { throw "terminal64.exe not found in C:\MT5" }

      - name: Start MT5, wait for broker, probe Python
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_TERMINAL_PATH: 'C:\MT5\terminal64.exe'
        run: |
          $ErrorActionPreference = "Continue"
          $terminal = "C:\MT5\terminal64.exe"
          $ini = "C:\mt5.ini"
          @("[Common]","Login=$env:MT5_LOGIN","Password=$env:MT5_PASSWORD","Server=$env:MT5_SERVER","[Experts]","Enabled=1","AllowLiveTrading=0") | Set-Content -LiteralPath $ini -Encoding ASCII

          Write-Host "Shell session id: $((Get-Process -Id $PID).SessionId); user: $(whoami)"
          $proc = Start-Process -FilePath $terminal -ArgumentList @("/portable", "/config:$ini") -PassThru
          Write-Host "Started terminal PID=$($proc.Id)"

          # Wait up to 3 minutes for any sign of a broker connection attempt.
          $found = $false
          for ($i = 1; $i -le 12; $i++) {
            Start-Sleep -Seconds 15
            $hit = Select-String -Path "C:\MT5\logs\*.log" -Pattern "authorized on|authorization|invalid account|no connection" -ErrorAction SilentlyContinue
            if ($hit) {
              $found = $true
              $hit | Select-Object -Last 5 | ForEach-Object { Write-Host $_.Line }
              break
            }
            Write-Host "No broker connection line yet after $($i * 15) seconds"
          }
          Write-Host "Broker connection line found = $found"

          Write-Host "===== TERMINAL PROCESS ====="
          Get-Process terminal64 -ErrorAction SilentlyContinue | Select-Object Id, SessionId, Responding, MainWindowTitle | Format-List

          Write-Host "===== SCREENSHOT ====="
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:GITHUB_WORKSPACE\screen.png")
            Write-Host "Screenshot saved"
          } catch {
            Write-Host "Screenshot failed: $_"
          }

          Write-Host "===== PYTHON PROBE ====="
          python mt5_probe.py

          Write-Host "===== TERMINAL LOG CONNECTION LINES ====="
          Select-String -Path "C:\MT5\logs\*.log" -Pattern "Network|authorized|login|failed|invalid|connect" -ErrorAction SilentlyContinue |
            Select-Object -Last 25 | ForEach-Object { Write-Host $_.Line }

          Copy-Item -Path "C:\MT5\logs" -Destination "$env:GITHUB_WORKSPACE\mt5-logs" -Recurse -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $ini -Force -ErrorAction SilentlyContinue

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-diagnostics
          path: |
            screen.png
            mt5-logs
          if-no-files-found: ignore
          retention-days: 3
