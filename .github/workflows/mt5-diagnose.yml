name: MT5 Diagnose

# Diagnostic only. Lets Python launch the MT5 terminal itself (no pre-start),
# with the newest MetaTrader5 package. No orders are sent.
# Runs automatically on every push to the mt5-diagnose branch.
on:
  push:
    branches: [mt5-diagnose]

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade MetaTrader5 requests
          python -m pip show MetaTrader5

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:TEMP "mt5setup.exe"
          Invoke-WebRequest "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
          New-Item -ItemType Directory -Path "C:\MT5" -Force | Out-Null
          Start-Process -FilePath $installer -ArgumentList '/auto /path:"C:\MT5"' -Wait
          if (-not (Test-Path "C:\MT5\terminal64.exe")) { throw "terminal64.exe not found in C:\MT5" }

      - name: Let Python launch MT5 itself
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_TERMINAL_PATH: 'C:\MT5\terminal64.exe'
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Session id: $((Get-Process -Id $PID).SessionId); elevated token:"
          whoami /groups | Select-String "High Mandatory"

          try {
            Set-MpPreference -DisableRealtimeMonitoring $true
            Write-Host "Defender real-time monitoring disabled for this test"
          } catch {
            Write-Host "Could not change Defender settings: $_"
          }

          # Make sure nothing is running, so Python is the one that launches the terminal.
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5

          Write-Host "===== PYTHON LAUNCH PROBE ====="
          python mt5_probe_launch.py

          Write-Host "===== NEWEST TERMINAL LOG, LAST 40 LINES ====="
          $log = Get-ChildItem -Path "C:\MT5\logs" -Filter "2*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($log) { Get-Content -LiteralPath $log.FullName -Tail 40 } else { Write-Host "No terminal log found" }

          Write-Host "===== SCREENSHOT ====="
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:GITHUB_WORKSPACE\screen.png")
            Write-Host "Screenshot saved"
          } catch {
            Write-Host "Screenshot failed: $_"
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-diagnostics
          path: screen.png
          if-no-files-found: ignore
          retention-days: 3
