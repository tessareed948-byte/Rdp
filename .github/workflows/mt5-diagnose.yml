name: MT5 Diagnose

# Diagnostic only. Installs the Deriv MT5 terminal (broker server list built in) and
# tests whether the Python package can attach to it, both when the terminal is
# already running and when Python launches it. No orders are sent.
# Runs automatically on every push to the mt5-diagnose branch.
on:
  push:
    branches: [mt5-diagnose]

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade MetaTrader5 requests
          python -m pip show MetaTrader5

      - name: Install Deriv MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:TEMP "deriv5setup.exe"
          Invoke-WebRequest "https://download.mql5.com/cdn/web/deriv.com.limited/mt5/deriv5setup.exe" -OutFile $installer
          New-Item -ItemType Directory -Path "C:\MT5" -Force | Out-Null
          Start-Process -FilePath $installer -ArgumentList '/auto /path:"C:\MT5"' -Wait
          if (-not (Test-Path "C:\MT5\terminal64.exe")) { throw "terminal64.exe not found in C:\MT5" }
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Test Python attach with the Deriv terminal
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_TERMINAL_PATH: 'C:\MT5\terminal64.exe'
        run: |
          $ErrorActionPreference = "Continue"

          function Get-SyncCount {
            $f = Get-ChildItem -Path "C:\MT5\logs" -Filter "2*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $f) { return 0 }
            return @(Get-Content -LiteralPath $f.FullName | Select-String -Pattern "terminal synchronized with").Count
          }

          # Test A: start the terminal ourselves, wait until it has synchronized, then attach from Python.
          $ini = "C:\mt5_login.ini"
          @("[Common]", "Login=$env:MT5_LOGIN", "Password=$env:MT5_PASSWORD", "Server=$env:MT5_SERVER") | Set-Content -LiteralPath $ini -Encoding ASCII
          $before = Get-SyncCount
          $proc = Start-Process -FilePath "C:\MT5\terminal64.exe" -ArgumentList @("/portable", "/config:$ini") -PassThru
          Write-Host "Test A: terminal started. PID=$($proc.Id)"
          for ($i = 1; $i -le 24; $i++) {
            Start-Sleep -Seconds 5
            if ((Get-SyncCount) -gt $before) {
              Write-Host "Test A: terminal synchronized after $($i * 5) seconds"
              break
            }
          }
          Start-Sleep -Seconds 10
          Write-Host "===== TEST A: ATTACH TO A RUNNING, CONNECTED TERMINAL ====="
          python mt5_probe.py

          # Test B: no terminal running, Python launches it with the credentials.
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5
          Write-Host "===== TEST B: PYTHON LAUNCHES THE TERMINAL ====="
          python mt5_probe_launch.py

          Write-Host "===== TERMINAL LOG, NETWORK LINES ====="
          $tlog = Get-ChildItem -Path "C:\MT5\logs" -Filter "2*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($tlog) {
            Get-Content -LiteralPath $tlog.FullName | Select-String -Pattern "Network|authoriz|synchronized" | Select-Object -Last 12 | ForEach-Object { Write-Host $_.Line }
          }
          Remove-Item -LiteralPath $ini -Force -ErrorAction SilentlyContinue
