name: Aurora Trade Autonomous RR+ Scanner (15m London/NY)

on:
  schedule:
    # Runs every 15 minutes Monday-Friday during London & NY Killzones (07:00 - 20:45 UTC)
    - cron: '*/15 7-20 * * 1-5'
  workflow_dispatch:
    inputs:
      style:
        description: 'Trading style (SCALPING, DAY_TRADING, SWING)'
        required: false
        type: choice
        default: DAY_TRADING
        options:
          - SCALPING
          - DAY_TRADING
          - SWING
      dispatch_to_github:
        description: 'Auto-trigger Deriv MT5 Demo Bridge if A/A+ signal qualifies'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  run-rr-plus-scan-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scan All Default Assets Across 22 Zero-Token Strategies
        env:
          APP_URL: ${{ vars.AURORA_APP_URL || 'https://trade.eunknowntech.com' }}
          CRON_SECRET: ${{ secrets.VERCEL_CRON_SECRET }}
          STYLE: ${{ github.event.inputs.style || 'DAY_TRADING' }}
          DISPATCH_TO_GH: ${{ github.event.inputs.dispatch_to_github || 'true' }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "ERROR: VERCEL_CRON_SECRET secret is missing." >&2
            exit 1
          fi
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${APP_URL}/api/automation/cycle" \
            -A "AuroraTrade-AutoScanner/1.0" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${CRON_SECRET}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -d "{\"style\":\"${STYLE}\",\"useGeminiGate\":true,\"dispatchToGitHub\":${DISPATCH_TO_GH}}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed "$ d")
          echo "HTTP_STATUS=${HTTP_CODE}"
          echo "$BODY" | jq . || echo "$BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
