name: Aurora Trade Manual Zero-Token Scan (Superseded by aurora-autonomous-scanner.yml)

# Schedule intentionally removed — scheduled scanning runs via .github/workflows/aurora-autonomous-scanner.yml
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-zero-token-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Run Manual Zero-Token Deterministic Scan
        env:
          CRON_SECRET: ${{ secrets.VERCEL_CRON_SECRET || secrets.CRON_SECRET || secrets.BRIDGE_CALLBACK_TOKEN }}
          BRIDGE_CALLBACK_TOKEN: ${{ secrets.BRIDGE_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          CRON_SECRET=$(printf '%s' "${CRON_SECRET:-}" | tr -d '\r\n')
          BRIDGE_CALLBACK_TOKEN=$(printf '%s' "${BRIDGE_CALLBACK_TOKEN:-}" | tr -d '\r\n')
          AUTH_KEY="${CRON_SECRET:-$BRIDGE_CALLBACK_TOKEN}"
          CODE=$(curl -sS --max-time 55 -o /tmp/manual_scan.txt -w "%{http_code}" -X POST "https://trade.eunknowntech.com/api/automation/cycle" \
            -A "AuroraTrade-AutoScanner/1.0" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $AUTH_KEY" \
            -H "X-Bridge-Callback-Token: $BRIDGE_CALLBACK_TOKEN" \
            -H "Authorization: Bearer $AUTH_KEY" \
            -d '{"style":"DAY_TRADING","useGeminiGate":false,"dispatchToGitHub":true}')
          echo "MANUAL_SCAN_HTTP=$CODE"
          head -c 500 /tmp/manual_scan.txt || true
          echo ""
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then exit 1; fi
